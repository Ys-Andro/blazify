name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build FOSS APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run FOSS unit tests
        run: ./gradlew --no-daemon testFossDebugUnitTest

      - name: Build optimized FOSS APK
        run: ./gradlew --no-daemon assembleFossRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blazify-foss-apk-${{ github.run_number }}
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14
