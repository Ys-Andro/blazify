name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build FOSS APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # android-actions/setup-android v3 defaults to installing the retired
      # SDK package "tools". Override that default and install only packages
      # this project actually needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      # API 37 is currently published by sdkmanager as android-37.0.
      # AGP 9.2.x can still look for the legacy android-37 directory name.
      # The alias keeps both lookups working without copying SDK files.
      - name: Normalize Android 37 SDK platform path
        shell: bash
        run: |
          set -euo pipefail
          platforms_dir="${ANDROID_HOME}/platforms"
          if [[ -d "${platforms_dir}/android-37.0" && ! -e "${platforms_dir}/android-37" ]]; then
            ln -s android-37.0 "${platforms_dir}/android-37"
          fi
          test -f "${platforms_dir}/android-37/android.jar"
          test -d "${ANDROID_HOME}/build-tools/37.0.0"

      # The app's optimized release variant falls back to the Android debug
      # signing config when no private release keystore is configured.
      # GitHub-hosted runners do not create ~/.android/debug.keystore for us.
      - name: Create CI debug keystore for release fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run FOSS unit tests
        run: ./gradlew --no-daemon --stacktrace testFossDebugUnitTest

      - name: Build optimized FOSS APK
        run: ./gradlew --no-daemon --stacktrace assembleFossRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blazify-foss-apk-${{ github.run_number }}
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
          retention-days: 14
